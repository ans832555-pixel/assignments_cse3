<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission 2026</title>
</head>
<body>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <section>
      <h2>Courses and Fees</h2>
      <table border="1">
        <caption>Available Courses</caption>
        <thead>
          <tr>
            <th scope="col">Course</th>
            <th scope="col">Seats</th>
            <th scope="col">Fees</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
          </tr>
          <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section>
      <form action="#" method="post">
        <fieldset>
          <legend>Application Form</legend>

          <p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required minlength="3">
          </p>

          <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
              <option value="btech">B.Tech CSE</option>
              <option value="bca">BCA</option>
            </select>
          </p>

          <p>
            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="4" cols="40" required></textarea>
          </p>

          <button type="submit">Apply</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ABC College</p>
  </footer>

</body>
</html>
